name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk LiquidLock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidLock-apk
          path: LiquidLock.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Liquid Lock 1.0.${{ github.run_number }}
          files: LiquidLock.apk
          make_latest: true
